<body>
<header><div class="wrap"><h1>個人保險理賠快速查詢</h1><p>輸入事故情境，優先查看固定日額；實支實付轉換日額列於備註</p></div></header>
<main>
<section class="panel">
 <div class="controls">
  <div class="full"><label for="query">事故情境／關鍵字</label><input id="query" placeholder="例如：意外住院5天、癌症確診、骨折、器官移植"></div>
  <div class="full"><label for="scenario">選擇理賠項目</label><select id="scenario"></select></div>
  <div><label for="days">住院天數（預設 1 日）</label><input id="days" type="number" min="1" max="365" step="1" value="1"></div>
  <div><label for="sort">排序方式</label><select id="sort"><option value="company">依保險公司</option><option value="amount">依額度文字</option></select></div>
 </div>
 <div class="small" style="margin-top:9px">輸入關鍵字會嘗試辨識情境；也可以直接從下拉選單選擇。</div>
 <div class="actions"><button id="reset" class="secondary" type="button">清除／重設</button></div>
</section>
<div id="output" aria-live="polite"></div>
<footer>
<strong>重要提醒：</strong>本工具是依使用者提供的保險項目 PDF 建立的個人查詢輔助，不是保險公司核賠結果。住院日額查詢會分別加總固定日額與實支實付住院上限；轉換日額只列備註，不重複納入加總。已依最新對照表排除劃線刪除的W12、W13、W15、W17。表列保額、限額、日額不可直接視為實際可領金額；實際給付仍須核對正式保單條款、事故原因、等待期、除外責任、收據與其他保險給付規定。資料未列明者會顯示「未找到明確額度」，不自行推定。
</footer>
</main>

function displayCompany(r){
 if(r.company!=="富邦") return r.company;
 if(["A","B","C","D","E"].includes(r.code)) return "富邦（錠律保經）";

}

function money(n){
 const v=Math.round(Number(n)||0);
 if(v<10000) return v.toLocaleString("zh-TW")+"元";
 const wan=Math.floor(v/10000), rest=v%10000;
 if(rest===0) return `${wan}萬元`;
 const q=Math.floor(rest/1000), h=Math.floor((rest%1000)/100), t=Math.floor((rest%100)/10), u=rest%10;
 let tail="";
 if(q) tail+=`${q}千`;
 if(h) tail+=`${h}百`;
 if(t) tail+=`${t}十`;
 if(u) tail+=`${u}`;
 return `${wan}萬${tail}元`;
}
function appendSummary(out, cfg){
 const summary=document.createElement("section");summary.className="summary";
 const heading=document.createElement("div");heading.innerHTML=`<strong>${money(cfg.total)}</strong> <span>${cfg.title}</span>`;summary.appendChild(heading);
 cfg.lines.forEach(([label,value])=>{const line=document.createElement("div");line.className="sumline";line.innerHTML=`<span>${label}</span><span class="sumvalue">${money(value)}</span>`;summary.appendChild(line)});
 if(cfg.suffix){const suffix=document.createElement("div");suffix.className="sumhint";suffix.textContent=cfg.suffix;summary.appendChild(suffix)}
 const hint=document.createElement("div");hint.className="sumhint";hint.textContent=cfg.note;summary.appendChild(hint);out.appendChild(summary);
}
function isTerminatedDeathRow(r, scenario){return (scenario==="意外身故"||scenario==="疾病身故") && ["A","F","I","K"].includes(r.code)}
function isSpecialPromptRow(r, scenario){
 if(r.basis.includes("提示標籤") || r.item.includes("（提示）") || r.item.includes("（備註）")) return true;
 if(["疾病住院/日","癌症住院/日"].includes(scenario) && r.code==="M") return true;
 return false;
}
function render(){
 const selected=scenarioSelect.value;
 let rows=records.filter(r=>r.scenario===selected);
 if(selected.includes("住院/日")) rows.sort((a,b)=>{
  const aConverted=a.item.includes("住院上限"), bConverted=b.item.includes("住院上限");
  if(aConverted!==bConverted) return aConverted?1:-1;
  return a.company.localeCompare(b.company,"zh-Hant")||a.code.localeCompare(b.code);
 });
 else if($("sort").value==="company") rows.sort((a,b)=>a.company.localeCompare(b.company,"zh-Hant")||a.code.localeCompare(b.code));
 const out=$("output");out.innerHTML="";
 const count=document.createElement("div");count.className="count";count.textContent=`${selected}｜找到 ${rows.length} 筆保障資料`;out.appendChild(count);

  const baseInsurers=[...new Set(baseClaimRows.map(displayCompany))];
  const specialInsurers=[...new Set(rows.filter(r=>isSpecialPromptRow(r,selected)).map(displayCompany))];

   const cert=document.createElement("section");cert.className="summary";
   const heading=document.createElement("div");
   heading.innerHTML=`<strong>${baseInsurers.length} 家</strong> <span>基本理賠預估送件保險公司</span>`;
   cert.appendChild(heading);
   const names=document.createElement("div");names.className="sumhint";
   names.textContent=baseInsurers.length ? "基本送件公司："+baseInsurers.join("、") : "此情境沒有可列入基本送件家數的保險公司。";
   cert.appendChild(names);
   if(specialInsurers.length){
    const special=document.createElement("div");special.className="sumhint";
    special.textContent="特殊條件提示（不計入基本家數）："+specialInsurers.join("、")+"。";
    cert.appendChild(special);
   }
   const note=document.createElement("div");note.className="sumhint";
   note.textContent="同一家保險公司即使有多張基本理賠保單只計一家；此為依目前情境推估的送件公司家數，不等同診斷證明正本份數，實際文件格式及份數以各公司理賠要求為準。";
   cert.appendChild(note);out.appendChild(cert);
  }
 if(rows.length && selected.includes("住院/日")){
  const days=Math.max(1,Math.min(365,parseInt($("days").value,10)||1));
  const dailyRows=rows.filter(r=>r.amount.includes("元／日") && !isSpecialPromptRow(r,selected));
  const fixedRows=dailyRows.filter(r=>!r.item.includes("住院上限"));
  const reimbursementRows=dailyRows.filter(r=>r.item.includes("住院上限"));
  const getDaily=r=>{const m=r.amount.replace(/,/g,"").match(/([0-9]+(?:\.[0-9]+)?)/);return m?Number(m[1]):0};
  const fixedPerDay=fixedRows.reduce((sum,r)=>sum+getDaily(r),0);
  const reimbPerDay=reimbursementRows.reduce((sum,r)=>sum+getDaily(r),0);
  const totalPerDay=fixedPerDay+reimbPerDay;
  const moneyFormat=money;
  const summary=document.createElement("section");summary.className="summary";
  const heading=document.createElement("div");heading.innerHTML=`<strong>${moneyFormat(totalPerDay*days)}</strong> <span>／${days} 日的名目額度合計</span>`;summary.appendChild(heading);
  const line1=document.createElement("div");line1.className="sumline";line1.innerHTML=`<span>固定／定額住院日額（${moneyFormat(fixedPerDay)}／日）</span><span class="sumvalue">${moneyFormat(fixedPerDay*days)}</span>`;summary.appendChild(line1);
  const line2=document.createElement("div");line2.className="sumline";line2.innerHTML=`<span>實支實付住院上限（${moneyFormat(reimbPerDay)}／日）</span><span class="sumvalue">${moneyFormat(reimbPerDay*days)}</span>`;summary.appendChild(line2);
  const hint=document.createElement("div");hint.className="sumhint";hint.textContent="計算方式：固定日額與實支實付每日上限分開統計，再呈現名目額度合計；實支實付上限不是固定現金給付，實際理賠依實際支出、條款及各保單限額核定。各保單是否可同時申請，仍須依條款確認。轉換日額僅列在個別保單備註，不重複加總。";summary.appendChild(hint);
  out.appendChild(summary);
 } else if(rows.length && sumConfigs[selected]) {
  appendSummary(out,sumConfigs[selected]);
 }
 if(rows.length){
  rows.forEach(r=>{
   const card=document.createElement("article");card.className="result";
   const top=document.createElement("div");top.className="top";
   const company=document.createElement("div");company.className="company";company.textContent=displayCompany(r);
   const code=document.createElement("span");code.className="code";code.textContent=`保單代號 ${r.code}`;
   top.append(company,code);
   const amount=document.createElement("div");amount.className="amount";amount.textContent=r.amount;
   const item=document.createElement("p");item.className="item";item.textContent=`理賠項目：${r.item}`;
   const basis=document.createElement("div");basis.className="basis";basis.textContent=`理賠依據／給付條件：${r.basis}`;
   card.append(top,amount,item,basis);
   if(isTerminatedDeathRow(r,selected)){
    const tag=document.createElement("div");tag.className="tags";
    const pill=document.createElement("span");pill.className="tag";pill.textContent="已於首年後解約，不納入身故合計";tag.appendChild(pill);card.appendChild(tag);
   } else if(isSpecialPromptRow(r,selected)){
    const tag=document.createElement("div");tag.className="tags";
    const pill=document.createElement("span");pill.className="tag";pill.textContent=(r.code==="M" && (selected==="疾病住院/日"||selected==="癌症住院/日"))?"特殊條件：定期重大疾病住院補助，僅提示不列入基本合計":"提示／備註，不納入主項合計";tag.appendChild(pill);card.appendChild(tag);
   }
   out.appendChild(card);
  });
 }else{
  const box=document.createElement("div");box.className="warning";
  box.textContent=(selected==="食物中毒慰問金"||selected==="看護費用保險金")
   ?"目前提供的 PDF 未找到此項目的明確保障名稱或額度，請再確認是否有其他保單或附約資料。"

  out.appendChild(box);
 }
}
